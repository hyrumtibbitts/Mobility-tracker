<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mobility</title>
    <meta name="description" content="A daily mobility and rehab tracker. All data stays on this device." />
    <meta name="theme-color" content="#08090b" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mobility" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <button type="button" class="back" id="back" hidden aria-label="Back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
        </button>
        <span class="brand" id="topbar-title">Mobility</span>
        <span class="topbar-date" id="today-label"></span>
      </header>

      <main>
        <!-- ------------------------------------------------------- HOME -->
        <section class="view" id="view-home">
          <div class="hero" id="hero"></div>

          <div class="controls">
            <p class="control-label">Today is a</p>
            <div id="home-controls"></div>
          </div>

          <div class="cards" id="cards"></div>
        </section>

        <!-- ------------------------------------------------------- LIST -->
        <section class="view" id="view-list" hidden>
          <div class="detail-head">
            <p class="eyebrow" id="list-eyebrow"></p>
            <h1 class="detail-title" id="list-title"></h1>
            <div class="detail-meter">
              <span id="list-sub"></span>
              <b id="list-count"></b>
            </div>
            <div class="track"><i id="list-bar"></i></div>
          </div>
          <div id="list-controls"></div>
          <ul class="list" id="list-body"></ul>
        </section>

        <!-- --------------------------------------------------- PROGRESS -->
        <section class="view" id="view-progress" hidden>
          <div class="stat-row" id="stat-row"></div>

          <div class="card">
            <div class="section-head tight">
              <h2 id="grid-title">12 weeks</h2>
              <span class="meter" id="grid-count"></span>
            </div>
            <div class="grid" id="grid" role="img" aria-label="Daily completion grid"></div>
            <div class="scale">
              <span>Less</span>
              <i class="cell l0"></i><i class="cell l1"></i><i class="cell l2"></i>
              <i class="cell l3"></i><i class="cell l4"></i>
              <span>More</span>
            </div>
            <p class="grid-detail" id="grid-detail">Tap a square to see that day.</p>
          </div>

          <div class="card" id="checkpoint">
            <div class="section-head tight"><h2>Ankle checkpoint</h2></div>
            <div id="checkpoint-body"></div>
          </div>

          <div class="card" id="measure-card">
            <div class="section-head tight"><h2>Knee-to-wall</h2></div>
            <div id="measure-body"></div>
          </div>

          <p class="foot">No account, no server. All data stays in this browser.</p>
          <p class="foot"><button type="button" class="link" id="reset-all">Erase all data</button></p>
        </section>
      </main>

      <nav class="tabbar" aria-label="Views">
        <a class="tab" href="#/" data-tab="today" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5 9 17.5 20 6.5"/></svg>
          <span>Today</span>
        </a>
        <a class="tab" href="#/progress" data-tab="progress">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
          <span>Progress</span>
        </a>
      </nav>
    </div>

    <script src="app.js"></script>
  </body>
</html>
